on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  push:
    branches:
      - master
  schedule:
    - cron: "0 3 * * 0" # Every sunday at 3am UTC.

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .github/files/.nvmrc

      - name: NodeJS version
        run: node -v

      - name: Corepack
        run: corepack enable

      - name: Yarn version
        run: yarn --version

      - name: Install
        run: yarn

      - name: Build
        run: yarn build

  validation:
    needs: build
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corepack
        run: corepack enable

      - name: Install
        run: yarn

      - name: Linting
        run: yarn lint

      - name: Build on Ubuntu
        run: yarn build

      - name: All generated code is commited
        run: |
          git update-index --refresh
          git diff-index --exit-code --name-status HEAD --

  select_runtimes:
    name: Select runtimes
    runs-on: ubuntu-latest
    outputs:
      runtimes: ${{ steps.set.outputs.runtimes }}
    env:
      # Secrets are not passed to runs from forks or dependabot. Without them,
      # only the anonymously pullable lts image can be tested.
      SECRETS_AVAILABLE: ${{ secrets.CLOUDSMITH_CICD_USER != '' }}
    steps:
      - id: set
        run: |
          if [ "$SECRETS_AVAILABLE" = "true" ]; then
            echo 'runtimes=["previous-lts", "lts", "ci"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runtimes=["lts"]' >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: [validation, select_runtimes]

    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.select_runtimes.outputs.runtimes) }}

    name: Tests
    uses: ./.github/workflows/tests.yml
    with:
      runtime: ${{ matrix.runtime }}
    secrets: inherit
