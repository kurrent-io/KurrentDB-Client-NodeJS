name: Load KurrentDB Runtime Configuration
on:
  workflow_call:
    inputs:
      runtime:
        description: "The runtime's name. Current options are: `ci`, `previous-lts`, `latest` and `qa`"
        required: true
        type: string

      registry:
        description: "When in QA mode, the Docker registry to use"
        type: string
        required: false

      image:
        description: "When in QA mode, the Docker image to use"
        type: string
        required: false

      tag:
        description: "When in QA mode, the Docker image tag to use"
        type: string
        required: false

    outputs:
      runtime:
        description: The runtime's name
        value: ${{ inputs.runtime }}

      registry:
        description: The Docker registry
        value: ${{ jobs.load.outputs.registry }}

      image:
        description: The Docker image
        value: ${{ jobs.load.outputs.image }}

      tag:
        description: The Docker image tag
        value: ${{ jobs.load.outputs.tag }}

jobs:
  load:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.set.outputs.registry }}
      image: ${{ steps.set.outputs.image }}
      tag: ${{ steps.set.outputs.tag }}

    steps:
      - name: Set KurrentDB Runtime Configuration Properties
        id: set
        env:
          RUNTIME: ${{ inputs.runtime }}
          REGISTRY: ${{ inputs.registry }}
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
          IMAGES: ${{ vars.KURRENTDB_DOCKER_IMAGES }}
          SECRETS_AVAILABLE: ${{ secrets.CLOUDSMITH_CICD_USER != '' }}
        run: |
          if [ "$RUNTIME" = "qa" ]; then
            {
              echo "registry=$REGISTRY"
              echo "image=$IMAGE"
              echo "tag=$TAG"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Runs without registry credentials must use the anonymously pullable
          # lts image: forks get neither vars nor secrets, dependabot gets vars
          # but not secrets, so key the fallback on secrets, not on vars.
          if [ "$SECRETS_AVAILABLE" != "true" ] || [ -z "$IMAGES" ]; then
            IMAGES='{"lts":{"registry":"docker.io/kurrentplatform","image":"kurrentdb","tag":"lts"}}'
          fi

          CONFIG=$(jq -ce --arg runtime "$RUNTIME" '.[$runtime]' <<< "$IMAGES") || {
            echo "No image configuration for runtime '$RUNTIME'" >&2
            exit 1
          }

          {
            echo "registry=$(jq -r '.registry' <<< "$CONFIG")"
            echo "image=$(jq -r '.image' <<< "$CONFIG")"
            echo "tag=$(jq -r '.tag' <<< "$CONFIG")"
          } >> "$GITHUB_OUTPUT"
